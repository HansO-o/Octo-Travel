openapi: 3.1.0
info:
  title: Earth API
  version: 1.2.0
  summary: Live API specification for an independent AI API relay
  description: |
    Machine-readable integration reference for Earth API, an independent
    third-party relay operated by Earth ICU. The documented public base URL is
    https://api.earth.icu/v1.

    This specification documents request shapes; it does not announce general
    availability, model access, pricing, uptime, full OpenAI API equivalence,
    or an official relationship with an upstream model provider. Confirm the
    service status, enabled model IDs, account access, and current prices before
    sending a generation request.

    Compatibility is a documented subset. Do not rely on sampling, token-limit,
    stored-response, previous-response, or background-request parameters without
    validating them for the selected model and endpoint.
  contact:
    name: Earth API integration feedback
    url: https://github.com/HansO-o/Octo-Travel/issues/new?template=earth-api-integration.yml
  x-launch-status: live
  x-last-reviewed: "2026-10-01T19:40:00+08:00"
servers:
  - url: https://api.earth.icu/v1
    description: Documented Earth API public host; verify account, models, and pricing before use
security:
  - bearerAuth: []
x-earth-response-boundary:
  public-field-projection: true
  upstream-identifiers-forwarded: false
  public-model-id-source: Earth API configured catalog
  public-errors-sanitized: true
  maximum-gateway-attempts: 2
  retry-only-before-public-output: true
  retry-after-public-output-started: false
  retry-requires-no-known-measured-usage: true
  retry-subject-to-cooldown-deadline-and-account-availability: true
  unknown-usage-estimated-or-erased: false
  deployed-at: "2026-10-01T17:43:58+08:00"
tags:
  - name: Models
    description: Discover model identifiers available to the authenticated account.
  - name: Chat Completions
    description: OpenAI-style chat request and response format.
  - name: Responses
    description: OpenAI-style Responses request and event format.
  - name: Messages
    description: Anthropic-style Messages request and response format.
paths:
  /models:
    get:
      operationId: listModels
      summary: List available models
      description: |
        Returns model identifiers visible to the authenticated Earth API account.
        A successful response does not confirm balance, price, or generation access.
      tags: [Models]
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        default:
          $ref: "#/components/responses/ApiError"
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      description: |
        Sends an OpenAI-style Chat Completions request. Set stream to false for
        JSON or true for server-sent events. Use service_tier for an explicit
        processing-tier request. The web_search_options object is an Earth API
        compatibility extension for Codex OAuth routes. Tier and search access
        depend on the selected model, route, and account. A request may incur
        charges. Public responses use Earth API model and response identifiers.
        One eligible transient failure may be retried internally before any
        public output begins; the gateway does not replay after output starts.
      tags: [Chat Completions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            example:
              model: YOUR_AVAILABLE_MODEL_ID
              messages:
                - role: user
                  content: Reply with one short greeting.
              stream: false
      responses:
        "200":
          description: Completion JSON or event stream, selected by the request
          headers:
            X-Earth-Retry-Count:
              $ref: "#/components/headers/EarthRetryCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent Chat Completions chunks using choices[].delta.
                  With stream_options.include_usage, read through the final
                  usage report before closing the connection.
        "401":
          $ref: "#/components/responses/AuthenticationError"
        default:
          $ref: "#/components/responses/ApiError"
  /responses:
    post:
      operationId: createResponse
      summary: Create a response
      description: |
        Sends an OpenAI-style Responses request. Set stream to false for JSON or
        true for named server-sent Responses events. Use service_tier for an
        explicit processing-tier request. Codex OAuth routes can request built-in
        search with tools: [{"type": "web_search"}]. Tier and search access
        depend on the selected model, route, and account. A request may incur
        charges. Public responses use Earth API model and response identifiers.
        One eligible transient failure may be retried internally before any
        public output begins; the gateway does not replay after output starts.
      tags: [Responses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseRequest"
            example:
              model: YOUR_AVAILABLE_MODEL_ID
              input: Say hello in one sentence.
              stream: false
      responses:
        "200":
          description: Response JSON or named event stream, selected by the request
          headers:
            X-Earth-Retry-Count:
              $ref: "#/components/headers/EarthRetryCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseObject"
            text/event-stream:
              schema:
                type: string
                description: |
                  Named server-sent Responses events. Continue through a terminal
                  response event to inspect status, usage, and actual service tier.
        "401":
          $ref: "#/components/responses/AuthenticationError"
        default:
          $ref: "#/components/responses/ApiError"
  /messages:
    post:
      operationId: createMessage
      summary: Create a message
      description: |
        Sends an Anthropic-style Messages request. Use an Earth API model-access
        key in x-api-key and include anthropic-version: 2023-06-01. A request
        may incur charges. Public responses use Earth API model and response
        identifiers. One eligible transient failure may be retried internally
        before any public output begins; the gateway does not replay after
        output starts.
      tags: [Messages]
      security:
        - anthropicApiKey: []
      parameters:
        - name: anthropic-version
          in: header
          required: true
          description: Anthropic protocol version documented by Earth API.
          schema:
            type: string
            examples: ["2023-06-01"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageRequest"
            example:
              model: YOUR_AVAILABLE_ANTHROPIC_MODEL_ID
              max_tokens: 1024
              messages:
                - role: user
                  content: Reply with one short greeting.
      responses:
        "200":
          description: Anthropic-style message response
          headers:
            X-Earth-Retry-Count:
              $ref: "#/components/headers/EarthRetryCount"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicMessageResponse"
            text/event-stream:
              schema:
                type: string
                description: Server-sent Anthropic Messages events when streaming is enabled.
        "401":
          $ref: "#/components/responses/AuthenticationError"
        default:
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Earth API key
      description: |
        Use an Earth API model-access key. Do not use an Ogin login token,
        an upstream-provider key, or an application's separate access key.
    anthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Earth API model-access key for the Anthropic Messages endpoint.
  headers:
    EarthRetryCount:
      description: |
        Present with value 1 when a successful response was produced by one
        eligible internal retry. Absence does not prove whether a provider was
        contacted, and clients should not add an immediate retry loop.
      schema:
        type: integer
        enum: [1]
  responses:
    AuthenticationError:
      description: Missing or invalid Earth API model-access key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ApiError:
      description: |
        Sanitized API, account, model, balance, rate-limit, or gateway error.
        Raw upstream response details and identifiers are not forwarded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Model:
      type: object
      required: [id]
      properties:
        id:
          type: string
        object:
          type: string
          examples: [model]
        created:
          type: integer
        owned_by:
          type: string
      additionalProperties: true
    ModelList:
      type: object
      required: [data]
      properties:
        object:
          type: string
          examples: [list]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
      additionalProperties: true
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items: {}
      additionalProperties: true
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Select an ID returned by GET /models for this account.
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: false
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
          additionalProperties: true
        service_tier:
          $ref: "#/components/schemas/RequestedServiceTier"
        web_search_options:
          type: object
          description: |
            Earth API Chat compatibility extension for Codex OAuth web search.
            An empty object opts in. Availability depends on the route, account,
            and model; parameter acceptance is not proof that a search ran.
          additionalProperties: true
        tools:
          type: array
          description: Availability varies by model; the application executes custom tools.
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ChatCompletion:
      type: object
      properties:
        id:
          type: string
          description: Earth API public response identifier.
        object:
          type: string
        created:
          type: integer
        model:
          type: string
          description: Earth API configured catalog ID used for this response.
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          description: Final validated token usage when supplied by the provider.
          additionalProperties: true
        service_tier:
          $ref: "#/components/schemas/ActualServiceTier"
        provider_data:
          type: object
          description: |
            Earth API compatibility extensions, including Codex web-search call
            metadata when available. Applications must tolerate absent fields.
          additionalProperties: true
      additionalProperties: true
    ResponseRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          description: Select an ID returned by GET /models for this account.
        input:
          oneOf:
            - type: string
            - type: array
              items: {}
        stream:
          type: boolean
          default: false
        service_tier:
          $ref: "#/components/schemas/RequestedServiceTier"
        tools:
          type: array
          description: |
            Availability varies by model and route. Custom function tools are
            executed by the application. On Codex OAuth routes, a built-in search
            can be requested with an item whose type is web_search.
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ResponseObject:
      type: object
      properties:
        id:
          type: string
          description: Earth API public response identifier.
        object:
          type: string
        model:
          type: string
          description: Earth API configured catalog ID used for this response.
        status:
          type: string
          description: Terminal state when supplied by the provider.
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          description: |
            Final validated token usage when supplied by the provider. Incomplete
            or failed terminal responses can still report billable usage.
          additionalProperties: true
        service_tier:
          $ref: "#/components/schemas/ActualServiceTier"
      additionalProperties: true
    RequestedServiceTier:
      type: string
      enum: [default, fast, priority]
      description: |
        Requested OpenAI processing tier. fast and priority are accepted aliases
        for supported routes. Acceptance does not prove priority processing;
        inspect the terminal response service_tier when present. This field is
        separate from reasoning effort and native Anthropic service tiers.
    ActualServiceTier:
      type: string
      description: |
        Processing tier reported by the upstream in the terminal response. A
        final default value means standard processing. If this field is absent,
        the client must not infer a tier from the request or elapsed time.
      examples: [default, priority]
    AnthropicMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          oneOf:
            - type: string
            - type: array
              items: {}
      additionalProperties: true
    AnthropicMessageRequest:
      type: object
      required: [model, max_tokens, messages]
      properties:
        model:
          type: string
          description: Select an Anthropic-compatible ID available to this account.
        max_tokens:
          type: integer
          minimum: 1
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AnthropicMessage"
        stream:
          type: boolean
          default: false
      additionalProperties: true
    AnthropicMessageResponse:
      type: object
      properties:
        id:
          type: string
          description: Earth API public message identifier.
        type:
          type: string
        role:
          type: string
        model:
          type: string
          description: Earth API configured catalog ID used for this response.
        content:
          type: array
          items: {}
        stop_reason:
          type: [string, "null"]
        usage:
          type: object
          additionalProperties: true
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: Sanitized public error message; raw upstream details are not forwarded.
            type:
              type: string
            param: {}
            code: {}
          additionalProperties: true
      additionalProperties: true
